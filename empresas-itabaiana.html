<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresas Parceiras em Itabaiana</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --bg-accent: #eadfcd;
      --panel: rgba(255, 252, 247, 0.94);
      --panel-border: rgba(92, 62, 34, 0.16);
      --text: #2d2219;
      --muted: #6a5748;
      --primary: #8a4b22;
      --primary-strong: #5f2f13;
      --tag: #efe2d1;
      --shadow: 0 18px 40px rgba(80, 50, 28, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(203, 155, 105, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(121, 157, 130, 0.18), transparent 24%),
        linear-gradient(180deg, var(--bg) 0%, #f9f6f0 48%, var(--bg-accent) 100%);
      padding: 32px 18px 56px;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .hero,
    .filters,
    .results {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -40px -70px auto;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 75, 34, 0.18), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
    }

    h1 {
      margin: 12px 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      max-width: none;
    }

    .hero p {
      margin: 0;
      max-width: 70ch;
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .stat {
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(138, 75, 34, 0.12);
      border-radius: 18px;
    }

    .stat strong {
      display: block;
      font-size: 1.7rem;
      color: var(--primary-strong);
      margin-bottom: 4px;
    }

    .filters {
      margin-top: 18px;
      padding: 22px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-strong);
    }

    input,
    select,
    button {
      width: 100%;
      border: 1px solid rgba(95, 47, 19, 0.18);
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
    }

    input:focus,
    select:focus,
    button:focus {
      outline: 2px solid rgba(138, 75, 34, 0.22);
      outline-offset: 2px;
    }

    button {
      background: var(--primary);
      color: #fffaf4;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: var(--primary-strong);
    }

    .results {
      margin-top: 18px;
      padding: 22px;
    }

    .results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid rgba(95, 47, 19, 0.12);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(247, 239, 226, 0.92));
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.08rem;
      line-height: 1.35;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--tag);
      color: var(--primary-strong);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .meta {
      display: grid;
      gap: 10px;
    }

    .meta div {
      display: grid;
      gap: 3px;
    }

    .meta span {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .meta strong,
    .meta a {
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      line-height: 1.45;
      word-break: break-word;
    }

    .meta a:hover {
      color: var(--primary-strong);
    }

    .empty {
      padding: 26px;
      border-radius: 18px;
      background: rgba(239, 226, 209, 0.6);
      color: var(--muted);
      text-align: center;
      display: none;
    }

    @media (max-width: 860px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .results-head {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">Cadastro comercial local</div>
      <h1>Empresas Parceiras em Itabaiana</h1>
      <div class="stats">
        <div class="stat">
          <strong id="totalCompanies">0</strong>
          <span>empresas listadas</span>
        </div>
        <div class="stat">
          <strong id="totalBranches">0</strong>
          <span>ramos identificados</span>
        </div>
        <div class="stat">
          <strong id="visibleCompanies">0</strong>
          <span>resultados exibidos</span>
        </div>
      </div>
    </section>

    <section class="filters">
      <div class="filter-grid">
        <div>
          <label for="search">Buscar</label>
          <input id="search" type="search" placeholder="Digite empresa, ramo, contato ou responsavel">
        </div>
        <div>
          <label for="branch">Ramo</label>
          <select id="branch">
            <option value="">Todos os ramos</option>
          </select>
        </div>
        <div>
          <label for="reset">Limpar</label>
          <button id="reset" type="button">Limpar filtros</button>
        </div>
      </div>
    </section>

    <section class="results">
      <div class="results-head">
        <div id="summary">Carregando dados...</div>
      </div>
      <div class="empty" id="emptyState">Nenhuma empresa encontrada com os filtros atuais.</div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

    const searchInput = document.getElementById("search");
    const branchSelect = document.getElementById("branch");
    const resetButton = document.getElementById("reset");
    const cards = document.getElementById("cards");
    const summary = document.getElementById("summary");
    const emptyState = document.getElementById("emptyState");
    const totalCompanies = document.getElementById("totalCompanies");
    const totalBranches = document.getElementById("totalBranches");
    const visibleCompanies = document.getElementById("visibleCompanies");

    function decodeCsv() {
      const normalized = csvBase64.replace(/\s+/g, "");
      const binary = atob(normalized);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const decoder = (() => {
        try {
          return new TextDecoder("windows-1252");
        } catch {
          return new TextDecoder("iso-8859-1");
        }
      })();

      return decoder.decode(bytes);
    }

    function parseCsv(rawCsv) {
      const lines = rawCsv.split(/\r?\n/);
      const records = [];
      let currentBranch = "";

      for (const line of lines) {
        if (!line.trim()) {
          continue;
        }

        const cols = line.split(";");
        if (cols.length < 5) {
          continue;
        }

        const first = cols[0].trim();
        const empresa = cols[1].trim();
        const fantasia = cols[2].trim();
        const contato = cols[3].trim();
        const responsavel = cols[4].trim();

        if (first === "TOTAL") {
          continue;
        }

        if (empresa && !fantasia && !contato && !responsavel) {
          currentBranch = empresa;
          continue;
        }

        if (!currentBranch || !empresa) {
          continue;
        }

        records.push({
          ramo: currentBranch,
          empresa,
          fantasia,
          contato,
          responsavel
        });
      }

      return records;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatPhone(phone) {
      const digits = phone.replace(/\D/g, "");

      if (digits.length === 11) {
        return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
      }

      if (digits.length === 10) {
        return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
      }

      return phone;
    }

    function cardTemplate(item) {
      const fantasy = item.fantasia ? `
        <div>
          <span>Nome fantasia</span>
          <strong>${escapeHtml(item.fantasia)}</strong>
        </div>
      ` : "";

      const contact = item.contato ? `
        <div>
          <span>Contato</span>
          <a href="tel:${item.contato.replace(/\D/g, "")}">${escapeHtml(formatPhone(item.contato))}</a>
        </div>
      ` : "";

      const responsible = item.responsavel ? `
        <div>
          <span>Responsavel</span>
          <strong>${escapeHtml(item.responsavel)}</strong>
        </div>
      ` : "";

      return `
        <article class="card">
          <div class="tag">${escapeHtml(item.ramo)}</div>
          <h2>${escapeHtml(item.empresa)}</h2>
          <div class="meta">
            ${fantasy}
            ${contact}
            ${responsible}
          </div>
        </article>
      `;
    }

    const records = parseCsv(decodeCsv());
    const branches = [...new Set(records.map((item) => item.ramo))].sort((a, b) => a.localeCompare(b, "pt-BR"));

    totalCompanies.textContent = String(records.length);
    totalBranches.textContent = String(branches.length);

    branchSelect.insertAdjacentHTML(
      "beforeend",
      branches.map((branch) => `<option value="${escapeHtml(branch)}">${escapeHtml(branch)}</option>`).join("")
    );

    function render() {
      const term = searchInput.value.trim().toLocaleLowerCase("pt-BR");
      const selectedBranch = branchSelect.value;

      const filtered = records.filter((item) => {
        const matchesBranch = !selectedBranch || item.ramo === selectedBranch;
        const searchable = [item.ramo, item.empresa, item.fantasia, item.contato, item.responsavel]
          .join(" ")
          .toLocaleLowerCase("pt-BR");
        const matchesTerm = !term || searchable.includes(term);
        return matchesBranch && matchesTerm;
      });

      visibleCompanies.textContent = String(filtered.length);
      summary.textContent = `${filtered.length} empresa(s) exibida(s) de ${records.length} no total.`;
      emptyState.style.display = filtered.length ? "none" : "block";
      cards.innerHTML = filtered.map(cardTemplate).join("");
    }

    searchInput.addEventListener("input", render);
    branchSelect.addEventListener("change", render);
    resetButton.addEventListener("click", () => {
      searchInput.value = "";
      branchSelect.value = "";
      render();
    });

    render();
  </script>
